name: tests
on: [push, pull_request]

env:
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Safety simulator smoke test (no data needed)
        run: python src/safety_sim.py --n 5 --plots-dir /tmp/sim
      - name: Autonomy Red Team regression suite (deterministic, no LLM/GPU/KITTI)
        run: |
          python -m autonomy_redteam regress \
            --suite scenarios/regression/ --baseline scenarios/baselines/v1.json --out /tmp/redteam-regress
      - name: Red-team regression, tiered contracts + statistics (improved planner, format-2 baseline)
        run: |
          python -m autonomy_redteam regress \
            --suite scenarios/regression/ --baseline scenarios/baselines/v2_improved.json --planner improved --out /tmp/redteam-regress-v2
      - name: Failure-to-fix demo smoke test (discovery -> fix -> protection)
        run: python -m autonomy_redteam fix-demo --no-gif --validation 60 --out /tmp/redteam-fix
      - name: Autonomy Red Team demo smoke test (small search budget)
        run: python -m autonomy_redteam demo --budget 30 --no-gif --out /tmp/redteam-demo
      - name: Upload red-team reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-reports-py${{ matrix.python-version }}
          path: |
            /tmp/redteam-regress
            /tmp/redteam-regress-v2
            /tmp/redteam-fix/report.md
            /tmp/redteam-demo/investigation/report.md
